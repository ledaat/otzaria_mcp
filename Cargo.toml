[workspace]
members = ["mcp"]
resolver = "2"

# `search_engine` is VENDORED at vendor/otzaria_search_engine/rust: the
# Otzaria/otzaria_search_engine v3.1.0 rust crate, matching the index the current
# Otzaria app builds (otzaria_index_meta.json: schema_version 5, engine 3.1.0,
# tantivy 0.26.2). See vendor/otzaria_search_engine/VENDORED.md.

# Engine 3.1.0 (matches the app's index: schema_version 5, tantivy 0.26.2) needs the
# same patches its own workspace applies, and [patch] only takes effect at the root.
[patch.crates-io]
tantivy-fst = { path = "vendor/otzaria_search_engine/rust/vendor/tantivy-fst" }
tantivy = { git = "https://github.com/Otzaria/tantivy", rev = "85b76fe364f11c452bd2ce941521ece474a02227" }
